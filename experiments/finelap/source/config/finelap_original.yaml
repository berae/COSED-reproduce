training:
  epochs: 10
  clip_grad: 2
  dropout: 0.2
  seed: 42
  device: cuda
  alpha: 1
  beta: 1
  gamma: 1
  freeze_audio_encoder: false
  freeze_text_encoder: false
  freeze_text_proj: false
  freeze_audio_proj: false
  freeze_audio_adapter: false
  loss_type:
  - sigmoid
  - grounding
  dist_impl: gather
  precision: fp32
  activation_checkpointing: true
model_args:
  ckpt_path: ''
  audio_encoder_args:
    type: eat
    audio_encoder_ckpt: ./weights/EAT-base_epoch30_ft.pt
  text_encoder_args:
    type: roberta-base
    text_encoder_ckpt: ./weights/roberta-base
  embed_size: 1024
  temp_global: 0.1
  b_global: -10
  temp_local: 0.1
  b_local: -10
  local_audio_proj_type: transformer
  normalize_dense_audio_embeds: true
  unify_audio_proj: false
optim_args:
  lr: 5.0e-05
  warmup_steps: 1000
  optimizer_name: adam
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  momentum: 0.9
  warmup_epochs: 2
dist_args:
  world_size: 1
  dist_url: env://
